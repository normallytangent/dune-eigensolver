[mv]                            # parameters used by matvec_performance_test
N = 20
n_iter = 1000
m = 8

[ev]                            # parameters used by eigenvalues_convergence_test and eigenvalues_test
N = 20                          # the resulting 2D matrix will be squared in each dimension, i.e. A^(N^2 x N^2).
M = 8
maxiter = 4000
shift = 1e-3
regularization = 0
accurate = 2                    # How many eigenvalues for measuring convergence? 1: 0.25 * M, 2: 0.5 * M, 3: 0.75 * M, 4: M
tol = 1e-3                      # tolerance of the stopping criterion.
stop = 2                        # 2: off-diag(Dk) < off-diag(D0), Dk = Qk^T * A * Qk; 1: off-diag(Dk) < diag(Dk); 0: A * Qk - Qk * Dk = 0, currently implemented only in GeneralizedInverse
threshold = 9e-2                # magnitude of the largest desired eigenvalue
verbose = 0                     # print output?-1: performance (none), 0: convergence (eigenvalues, error, timing), 1: debug, 2: verbose
overlap = 3                     # number of overlapping subdomains in the model problem
seed = 400                      # seed for the random uniform distribution
method = gen                    # std: Standard eigenvalueproblem, gen: Generalized problem
grid = checkerboard             # checkerboard: use aharmonic subdomains, coord: use aharmonic coord subdomains
subdomain = 7722                # subdomain number for checkerboard- or coor-gevps
submethod = stw                 # ftw: GeneralizedInverse, stw: GeneralizedSymmetricStewart
adapt = 0                       # 1: ..Adaptive methods, set threshold
symmetric = 1                   # 1: symmetric matrices

[parallel]                      # parameters used by eigenvalues_test and mgs_performance_test
numthreads = 1

[mgs]                           # parameters used by mgs_performance_test
n = 20
m = 16
n_iter = 15